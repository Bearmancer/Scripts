[project]
name = "toolkit"
version = "1.0.0"
description = "Personal toolkit for audio, video, and file operations"
requires-python = ">=3.14"
authors = [
	{ name = "Lance" }
]
dependencies = [
	"chardet",
	"cyclopts",
	"deflacue",
	"ffmpeg-python",
	"google-auth",
	"gspread",
	"pathvalidate",
	"Pillow",
	"playwright",
	"py3createtorrent",
	"pylast",
	"pyperclip",
	"requests",
	"rich",
	"tqdm",
	"unidecode",
]

[project.scripts]
toolkit = "toolkit.cli:main"

[dependency-groups]
dev = [
	"ruff",
	"ty",
	"types-Pillow",
	"types-requests",
	"types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit"]

[tool.uv]
default-groups = ["dev"]

# ==============================================================================
# RUFF CONFIGURATION (Linting & Formatting)
# ==============================================================================

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	"W191",
	"ANN401", # dynamically-typed-expression (typing.Any is sometimes necessary)
	"D", # pydocstyle (Ignored to prevent docstring noise; remove if you want strict docs)
	"COM812", # missing-trailing-comma (Ignored: conflicts with Ruff formatter)
	"ISC001", # single-line-implicit-string-concatenation (Ignored: conflicts with Ruff formatter)
	"G004",
	"TC001",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true

[tool.ruff.lint.isort]
known-first-party = ["toolkit"]
combine-as-imports = true

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

# ==============================================================================
# TY CONFIGURATION (Strict Type Checking)
# ==============================================================================

[tool.ty.rules]
all = "error"

[tool.ty.environment]
python-version = "3.14"
python-platform = "win32" # Tailored to your Windows environment

[tool.ty.analysis]
respect-type-ignore-comments = true

replace-imports-with-any = [
	"ffmpeg",
	"pyperclip",
	"deflacue",
	"py3createtorrent",
	"pylast",
	"pathvalidate",
]

[tool.ty.terminal]
error-on-warning = true
output-format = "full"
