[project]
name = "toolkit"
version = "1.0.0"
description = "Personal toolkit for audio, video, and file operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chardet",
    "playwright",
    "cyclopts",
    "deflacue",
    "ffmpeg-python",
    "google-auth",
    "gspread",
    "pathvalidate",
    "pyperclip",
    "Pillow",
    "py3createtorrent",
    "pylast",
    "requests",
    "rich",
    "tqdm",
    "unidecode",
]

[project.scripts]
toolkit = "toolkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "types-Pillow",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "none"
addopts = "--basetemp=.pytest_tmp"
